<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1B5E20" />
    <title>Offline | Chamabondo</title>
    <style>
      :root {
        color-scheme: light;
        --green: #1b5e20;
        --green-dark: #124416;
        --gold: #d4af37;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: #ffffff;
        color: #334155;
      }

      main {
        width: 100%;
        max-width: 440px;
        overflow: hidden;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        box-shadow: 0 18px 45px -20px rgba(15, 23, 42, 0.35);
      }

      .top {
        padding: 32px 24px 26px;
        background: linear-gradient(135deg, var(--green), var(--green-dark));
        color: #ffffff;
        text-align: center;
      }

      .crest {
        display: inline-flex;
        width: 68px;
        height: 68px;
        align-items: center;
        justify-content: center;
        border: 2px solid rgba(212, 175, 55, 0.85);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.1);
      }

      .crest svg {
        width: 44px;
        height: 44px;
      }

      h1 {
        margin: 16px 0 0;
        font-size: 22px;
        line-height: 1.25;
        letter-spacing: -0.02em;
      }

      .top p {
        margin: 8px 0 0;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.78);
      }

      .body {
        padding: 24px;
        text-align: center;
      }

      .body p {
        margin: 0;
        font-size: 15px;
        line-height: 1.65;
      }

      .body p + p {
        margin-top: 10px;
        font-size: 13px;
        color: #64748b;
      }

      a {
        display: inline-flex;
        min-height: 48px;
        margin-top: 22px;
        align-items: center;
        justify-content: center;
        padding: 0 22px;
        border-radius: 12px;
        background: var(--green);
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid rgba(212, 175, 55, 0.75);
        outline-offset: 3px;
      }

      .status {
        display: inline-flex;
        margin-top: 18px;
        align-items: center;
        gap: 7px;
        border-radius: 999px;
        background: #fef3c7;
        padding: 6px 12px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #92400e;
      }

      .status span {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: #d97706;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="top">
        <span class="crest" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path
              d="M16 2.5 4.5 6v9.2c0 7 4.9 12.4 11.5 14.3 6.6-1.9 11.5-7.3 11.5-14.3V6L16 2.5Z"
              fill="#ffffff"
              opacity="0.16"
            />
            <path
              d="M16 4.6l8.6 2.5v7.7c0 5.3-3.5 9.4-8.6 11-5.1-1.6-8.6-5.7-8.6-11V7.1L16 4.6Z"
              stroke="#D4AF37"
              stroke-width="1.2"
            />
            <path d="M10.5 13h6a1.6 1.6 0 0 1 1.6 1.6v7.2a1.6 1.6 0 0 0-1.6-1.6h-6V13Z" fill="#D4AF37" />
            <path d="M21.5 13h-6a1.6 1.6 0 0 0-1.6 1.6v7.2a1.6 1.6 0 0 1 1.6-1.6h6V13Z" fill="#D4AF37" opacity="0.75" />
          </svg>
        </span>
        <h1>You&rsquo;re offline</h1>
        <p>Chamabondo Teacher Management</p>
      </section>

      <section class="body">
        <p>
          We can&rsquo;t reach the network right now. Your saved app screens are still
          available, but new changes need a connection.
        </p>
        <p>Check your Wi-Fi or mobile data, then try again.</p>

        <a href="/">Open the app</a>
        <br />
        <span class="status"><span></span>Waiting for a connection</span>
      </section>
    </main>

    <script>
      window.addEventListener('online', function () {
        window.location.replace('/')
      })
    </script>
  </body>
</html>
